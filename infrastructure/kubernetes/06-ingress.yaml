apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: releaseguard-ingress
  namespace: releaseguard
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: releaseguard.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: releaseguard-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: releaseguard-frontend
                port:
                  number: 80
