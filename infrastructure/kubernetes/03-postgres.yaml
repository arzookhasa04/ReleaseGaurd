apiVersion: apps/v1
kind: Deployment
metadata:
  name: releaseguard-postgres
  namespace: releaseguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: releaseguard-postgres
  template:
    metadata:
      labels:
        app: releaseguard-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "releaseguard"
            - name: POSTGRES_PASSWORD
              value: "releaseguard_secure_password"
            - name: POSTGRES_DB
              value: "releaseguard_db"
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: releaseguard-postgres
  namespace: releaseguard
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: releaseguard-postgres
