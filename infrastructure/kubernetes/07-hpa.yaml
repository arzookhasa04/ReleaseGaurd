apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: releaseguard-backend-hpa
  namespace: releaseguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: releaseguard-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: releaseguard-backend-monitor
  namespace: releaseguard
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: releaseguard-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
