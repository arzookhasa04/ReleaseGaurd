apiVersion: apps/v1
kind: Deployment
metadata:
  name: releaseguard-backend
  namespace: releaseguard
  labels:
    app: releaseguard-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: releaseguard-backend
  template:
    metadata:
      labels:
        app: releaseguard-backend
    spec:
      containers:
        - name: backend
          image: releaseguard/backend:v1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: releaseguard-config
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: releaseguard-backend
  namespace: releaseguard
  labels:
    app: releaseguard-backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: releaseguard-backend
