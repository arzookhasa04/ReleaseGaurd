apiVersion: apps/v1
kind: Deployment
metadata:
  name: releaseguard-frontend
  namespace: releaseguard
  labels:
    app: releaseguard-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: releaseguard-frontend
  template:
    metadata:
      labels:
        app: releaseguard-frontend
    spec:
      containers:
        - name: frontend
          image: releaseguard/frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: releaseguard-frontend
  namespace: releaseguard
  labels:
    app: releaseguard-frontend
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: releaseguard-frontend
