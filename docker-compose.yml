version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: releaseguard-postgres
    environment:
      POSTGRES_USER: releaseguard
      POSTGRES_PASSWORD: releaseguard_secure_password
      POSTGRES_DB: releaseguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseguard -d releaseguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - releaseguard-net

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: releaseguard-backend
    environment:
      DATABASE_URL: postgresql://releaseguard:releaseguard_secure_password@postgres:5432/releaseguard_db
      ENVIRONMENT: production
      KUBERNETES_ENABLED: "false"
      CORS_ORIGINS: '["*"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - releaseguard-net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: releaseguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - releaseguard-net

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: releaseguard-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - releaseguard-net

  grafana:
    image: grafana/grafana:10.3.3
    container_name: releaseguard-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - releaseguard-net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  releaseguard-net:
    driver: bridge
